energy_manager:
  module: energy_manager
  class: EnergyController

  # --- 1. Config for OLD Simple Control Logic ---
  sensors_simple:
    grid_power: sensor.grid_power
    battery_soc: sensor.battery_soc
    heating_demand_boolean: input_boolean.heating_demand
  
  miner_heater:
    switch_entity: switch.bitcoin_miner
    power_draw: 2000
    min_battery_soc: 95

  # --- NEW: Wallbox Handler Config ---
  wallbox:
    power_sensor: sensor.wallbox_power
    fast_charge_switch: input_boolean.wallbox_fast_charge
    power_limit_entity: number.wallbox_charge_power
    min_surplus_for_charging: 500
    max_power: 11000
  
  publish_entities_simple:
    pv_surplus: sensor.controller_pv_surplus
    battery_soc: sensor.controller_battery_soc
    heating_demand: binary_sensor.controller_heating_demand

  # --- 2. NEW Config for Attribution Engine ---
  
  # Power sensors (endpoints) for attribution
  sensors_power:
    pv_power: sensor.pv_leistung
    grid_power: sensor.netz_leistung # Positive=Import, Negative=Export
    battery_power: sensor.batterie_leistung # Positive=Charge, Negative=Discharge
    miner_power: sensor.bitcoin_miner_stromverbrauch
    wallbox_power: sensor.wallbox_leistung

  # Priority lists for the engine
  priority:
    # Which sources are used first? (Cheapest/most preferred first)
    production:
      - pv
      - battery
      - grid
    # Which loads are satisfied first? (Most critical first)
    consumption:
      - house_load # The unmeasured residual load
      - battery
      - wallbox # Charge with surplus before miner
      - miner
      - grid       # Grid export has the lowest priority
  
  # The single entity to publish the full matrix to
  publish_attribution_entity: sensor.energy_flow_attribution